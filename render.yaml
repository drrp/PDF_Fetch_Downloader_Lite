# Render Blueprint for PDF Fetch Downloader (Search & Download, no login)
# A single FastAPI web service that also serves the frontend.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: pdf-fetch-downloader-lite
    runtime: python
    plan: free             # free tier: no card needed, but the service sleeps after ~15 min idle
    region: singapore      # closest Render region to India
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeploy: true
    # NOTE: this domain is currently attached to the older PDF_Fetch_Downloader
    # service. Render allows a custom domain on only one service, so release it
    # there first (see DEPLOY.md, step 2) or this will fail to apply.
    domains:
      - library.auchithyam.com
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
    # Persistent disk so downloaded PDFs survive restarts. Needs a paid instance
    # and a payment method on file, so it is commented out for the free tier.
    # disk:
    #   name: downloads
    #   mountPath: /opt/render/project/src/downloads
    #   sizeGB: 1
