<!doctype html>
<html lang="te">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>లాగిన్ — Telugu Digital Library Hub</title>
    <link rel="icon" type="image/png" href="/static/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Telugu:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --maroon: #7a1f2b;
        --maroon-dark: #5c1620;
        --gold: #c9a227;
        --ink: #241f1c;
        --muted: #6f665c;
        --line: #e8e1d6;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: "Inter", "Noto Sans Telugu", system-ui, sans-serif;
        color: var(--ink);
        background-color: #f7f4ee;
        background-image:
          radial-gradient(900px 420px at 12% -10%, rgba(201, 162, 39, 0.16), transparent 60%),
          radial-gradient(800px 400px at 92% 4%, rgba(122, 31, 43, 0.1), transparent 55%);
        background-attachment: fixed;
      }

      .login-card {
        width: 100%;
        max-width: 430px;
        text-align: center;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 40px 34px 26px;
        box-shadow: 0 24px 50px -24px rgba(92, 22, 32, 0.35);
      }

      .logo {
        height: 96px;
        width: auto;
        margin-bottom: 18px;
      }

      .title {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.4px;
        color: var(--maroon-dark);
        margin: 0 0 4px;
      }

      .subtitle {
        font-family: "Noto Sans Telugu", sans-serif;
        font-size: 19px;
        font-weight: 700;
        color: var(--maroon);
        margin: 0 0 14px;
      }

      .description {
        font-family: "Noto Sans Telugu", sans-serif;
        font-size: 14.5px;
        line-height: 1.75;
        color: var(--muted);
        margin: 0 0 30px;
      }

      .google-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        width: 100%;
        padding: 13px 22px;
        border-radius: 12px;
        background: #fff;
        color: #3c4043;
        border: 1.5px solid var(--line);
        font-family: "Noto Sans Telugu", sans-serif;
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
        transition: border-color 0.18s, box-shadow 0.18s;
      }

      .google-btn:hover {
        border-color: var(--maroon);
        box-shadow: 0 10px 22px -12px rgba(92, 22, 32, 0.55);
      }

      .google-btn svg {
        width: 20px;
        height: 20px;
        flex: 0 0 auto;
      }

      .divider {
        height: 1px;
        margin: 28px 0 18px;
        background: linear-gradient(90deg, transparent, var(--line), transparent);
      }

      .footer-text {
        font-size: 12.5px;
        color: var(--muted);
      }

      .footer-text a {
        font-family: "Noto Sans Telugu", sans-serif;
        color: var(--maroon);
        font-weight: 700;
        text-decoration: none;
      }

      .footer-text a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <img src="/static/logo.png" alt="ఔచిత్యమ్" class="logo" />

      <h1 class="title">Telugu Digital Library Hub</h1>
      <h2 class="subtitle">స్వాగతం</h2>

      <p class="description">
        ఈ అన్వేషణ వేదికను యాక్సెస్ చేయడానికి దయచేసి మీ Google ఖాతాతో సురక్షితంగా లాగిన్
        అవ్వండి.
      </p>

      <a href="/login/google" class="google-btn">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
        </svg>
        Google తో లాగిన్ అవ్వండి
      </a>

      <div class="divider"></div>

      <div class="footer-text">
        Developed by
        <a href="https://auchithyam.com" target="_blank" rel="noopener">ఔచిత్యమ్</a>
        · © 2026
      </div>
    </div>
  </body>
</html>
